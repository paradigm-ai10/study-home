<title>AI 學習地圖</title>
<!-- Wrapper around the approved map (mindmap/r15-side.html): the same css/js by relative path, without the review kit.
     Nothing in mindmap/ is copied or changed. embed.js adds the bridge to the page that frames it. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Iansui&text=%E5%BE%9E%E9%80%99%E8%A3%A1%E9%96%8B%E5%A7%8B%E2%86%92%E2%86%93%E9%80%9A%E9%81%8E%E9%A9%97%E6%94%B6%E2%9C%93%E2%86%BB%E9%87%8D%E6%92%AD%20&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../mindmap/spec/spec.css">
<link rel="stylesheet" href="../../../../mindmap/r8.css">
<link rel="stylesheet" href="../../../../mindmap/r11.css">
<link rel="stylesheet" href="../../../../mindmap/r15.css">
<style>
  /* held back until the frame says "play" (?wait): the paper is there, the drawing is not yet */
  #stage { transition: opacity 180ms ease-out; }
  html.wait #stage { opacity: 0; }
  /* progress notes inside the map's own side panel (same type and colours as the panel) */
  #panel li .pg { font-size: 14px; white-space: nowrap; margin-left: 8px; color: var(--muted); }
  #panel li .pg.next { color: var(--terra); }
  #panel li a.go { color: inherit; text-decoration: underline; text-decoration-color: #CFC7B6; text-underline-offset: 3px; }
  #panel li a.go:hover { text-decoration-color: var(--terra); }
</style>
</head>
<body data-theme="pencil" class="r15">
<svg id="map" viewBox="0 0 1420 790" aria-label="AI 學習地圖"></svg>
<div id="card"></div>
<aside id="panel"></aside>
<script>if (/[?&]wait/.test(location.search)) document.documentElement.classList.add('wait');</script>
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"></script>
<script src="../../../../mindmap/data8.js"></script>
<script src="../../../../mindmap/spec/spec.js"></script>
<script src="../../../../mindmap/r8.js"></script>
<script src="../../../../mindmap/tree.js"></script>
<script src="../../../../mindmap/r11.js"></script>
<script src="../../../../mindmap/r15-side.js"></script>
<script src="embed.js"></script>
</body>
</html>
