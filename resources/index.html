<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FFF4E0">
<title>資源下載｜Paradigm 學 AI</title>
<meta name="description" content="Paradigm 各課的教學 PDF、可直接安裝的 Skill 與提示詞，免費下載。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 13 7%27%3E%3Cpath fill=%27%23D97757%27 d=%27M2 0h9v2h2v2h-2v1H2V4H0V2h2z%27/%3E%3Cpath fill=%27%23D97757%27 d=%27M3 5h1v2H3zM5 5h1v2H5zM7 5h1v2H7zM9 5h1v2H9z%27/%3E%3Cpath fill=%27%231a1a1a%27 d=%27M4 1h1v2H4zM8 1h1v2H8z%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Outfit:wght@500;600&display=swap">
<style>
  /* 外觀照首頁簡潔版（核心螃蟹/環境/f4-雨夜書桌/simple.html）：奶油底、葡萄色字、陽光黃主按鈕。
     資料在 resources.js（由 make_resources.py 從各課私訊回覆稿產生），這頁只負責畫。 */
  :root {
    --cream: #FFF4E0; --sheet: #FFFAF0; --grape: #3A2E5C;
    --grape-2: rgba(58, 46, 92, .78); --grape-3: rgba(58, 46, 92, .74); --line: rgba(58, 46, 92, .18);
    --coral: #FF6B57; --coral-ink: #C0351F; --sun: #FFC857;
    --zh: "Huninn", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
    --en: "Outfit", "Huninn", system-ui, sans-serif;
    --pad: clamp(16px, 4vw, 56px);
  }
  * { box-sizing: border-box; }
  html { background: var(--cream); }
  body { margin: 0; background: var(--cream); color: var(--grape); font-family: var(--zh); font-size: 15.5px; line-height: 1.7; letter-spacing: .02em; -webkit-font-smoothing: antialiased; }
  :focus-visible { outline: 3px solid var(--coral-ink); outline-offset: 3px; border-radius: 4px; }
  a { color: inherit; }
  h1, h2, h3, p, ul { margin: 0; }
  h1, h2, h3 { font-weight: 400; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 var(--pad); }

  .top { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-top: 18px; }
  .wordmark { font: 600 13px/1 var(--en); letter-spacing: .26em; text-decoration: none; padding: 8px 0; }
  .home { text-decoration: none; font-size: 14px; padding: 7px 13px 8px; border-radius: 8px; box-shadow: inset 0 0 0 1.5px var(--grape-3); line-height: 1.2; white-space: nowrap; }
  .home:hover { box-shadow: inset 0 0 0 1.5px var(--grape); background: var(--sheet); }

  .head { padding: clamp(28px, 6vh, 56px) 0 clamp(20px, 4vh, 32px); border-bottom: 1px solid var(--line); }
  .head h1 { font-size: clamp(30px, 2.7vw, 38px); line-height: 1.36; letter-spacing: .03em; }
  .head p { margin-top: 10px; font-size: 16px; color: var(--grape-2); max-width: 36em; }

  .packs { list-style: none; padding: 0; margin: 28px 0 0; display: grid; gap: 20px; }
  .pack { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 26px 28px 24px; display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 0 20px; }
  .pack .no { font: 600 30px/1.1 var(--en); color: var(--coral-ink); letter-spacing: .02em; }
  .pack h2 { font-size: 23px; line-height: 1.4; letter-spacing: .03em; }
  .pack .sum { margin-top: 6px; color: var(--grape-2); max-width: 40em; }
  .files { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 12px; }
  .dl {
    display: inline-flex; align-items: center; gap: 10px; text-decoration: none;
    background: var(--sun); color: var(--grape); font-size: 16px; line-height: 1.3; padding: 13px 18px; border-radius: 10px;
    box-shadow: 0 2px 0 #c9942a; transition: translate 90ms ease-out, box-shadow 90ms ease-out, background-color 120ms ease-out;
  }
  .dl:hover { background: #ffd373; }
  .dl:active { translate: 0 2px; box-shadow: 0 0 0 #c9942a; }
  .dl .kind { font: 600 12px/1 var(--en); letter-spacing: .1em; padding: 4px 6px; border-radius: 4px; box-shadow: inset 0 0 0 1.5px var(--grape-3); }
  .notes { margin-top: 14px; padding-left: 1.2em; font-size: 14.5px; list-style: disc; }
  .notes li + li { margin-top: 2px; }
  .meta { margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--line); display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; font-size: 14.5px; }
  .meta dt { color: var(--grape-3); }
  .meta dd { margin: 0; }
  .meta a { text-underline-offset: 4px; text-decoration-color: var(--coral); text-decoration-thickness: 1.5px; }
  .meta .num { font: 600 13.5px/1 var(--en); margin-right: 6px; }

  .foot { margin: 40px 0 56px; font-size: 14px; color: var(--grape-2); }

  @media (max-width: 640px) {
    .pack { grid-template-columns: minmax(0, 1fr); padding: 20px 18px; }
    .pack .no { font-size: 22px; margin-bottom: 4px; }
    .dl { width: 100%; }
    .meta { grid-template-columns: minmax(0, 1fr); gap: 0; }
    .meta dd + dt { margin-top: 8px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="wordmark" href="../crab/rooms/f4/index.html">PARADIGM</a>
    <a class="home" href="../crab/rooms/f4/index.html">← 回首頁</a>
  </header>
  <main>
    <section class="head">
      <h1>資源下載</h1>
      <p>每一課的教學 PDF、可直接安裝的 Skill 與提示詞，都整理在這裡，免費下載。</p>
    </section>
    <ol class="packs" id="packs"></ol>
    <p class="foot">檔案存放在 Google 雲端硬碟，點下載會開新分頁，不需要登入。</p>
  </main>
</div>
<script src="resources.js"></script>
<script>
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const IG = 'https://www.instagram.com/paradigmai_tw/'
document.getElementById('packs').innerHTML = window.RESOURCES.map(p => `<li class="pack" id="${esc(p.id)}">
  <span class="no">${esc(p.no)}</span>
  <div>
    <h2>${esc(p.title)}</h2>
    <p class="sum">${esc(p.summary)}</p>
    <div class="files">${p.files.map(f => `<a class="dl" href="${esc(f.href)}" target="_blank" rel="noopener"><span class="kind">${esc(f.kind)}</span><span>${esc(f.label)}</span></a>`).join('')}</div>
    <ul class="notes">${p.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul>
    <dl class="meta">
      <dt>對應課程</dt><dd><a href="${esc(p.lesson.href)}"><span class="num">${esc(p.lesson.id)}</span>${esc(p.lesson.title)}</a></dd>
      <dt>IG 領取</dt><dd>在 <a href="${IG}" target="_blank" rel="noopener">IG @paradigmai_tw</a> 的 Reel 留言「${esc(p.keyword)}」，我們會私訊下載連結給你。</dd>
      <dt>更新日期</dt><dd>${esc(p.updated)}</dd>
    </dl>
  </div>
</li>`).join('')
</script>
</body>
</html>
